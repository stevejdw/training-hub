name: Backfill Laps

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max activities per run (each uses 2 Strava calls: laps + streams)'
        required: false
        default: '30'
  schedule:
    # Every 15 minutes, like segment backfill. Each run processes ~30 activities
    # (60 API calls, under the 100/15-min ceiling so no mid-run sleeps).
    # Script stops itself once daily cap of 950 calls is reached; subsequent
    # runs that day exit fast.
    - cron: '*/15 * * * *'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Run lap backfill
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKFILL_LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: python .github/scripts/backfill_laps.py
