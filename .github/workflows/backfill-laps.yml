name: Backfill Laps

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max activities per run (each uses 2 Strava calls: laps + streams)'
        required: false
        default: '30'
  # No schedule. These are Strava backfills, and the script gates itself on
  # strava_ingest_enabled — with Garmin primary it prints one line and exits,
  # so the daily run was booting a runner to do nothing. Same reasoning as
  # sync.yml; restore a cron there and here together if Strava ever becomes
  # the primary source again.

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Run lap backfill
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKFILL_LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: python .github/scripts/backfill_laps.py
