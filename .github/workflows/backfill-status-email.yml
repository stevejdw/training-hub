name: Backfill Status Email

on:
  schedule:
    # 6am AEST = 20:00 UTC (winter). For AEDT (summer), it arrives at 7am.
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Send daily backfill status email
        env:
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO:       steve@dewit.com.au
        run: python .github/scripts/backfill_status_email.py
