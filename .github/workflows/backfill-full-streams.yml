name: Backfill Full Streams

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max activities per run (1 Strava call each)'
        required: false
        default: '60'
  schedule:
    # Every 4 hours. Each run uses up to 60 Strava calls (well within the
    # 100/15-min window). The script self-stops at 950 daily calls so it
    # doesn't crowd out the app or other workflows.
    #
    # That daily cap — shared with the laps backfill — is the real limit, not the
    # schedule. The old 15-minute cron exhausted the quota early and then no-opped
    # for the rest of the day ("Re-run tomorrow — daily Strava limit resets at
    # 00:00 UTC"), costing ~40 billed Actions minutes a day, because every job is
    # rounded up to a whole minute however briefly it runs. Six runs here plus six
    # in laps is ~720 calls, which uses the quota with headroom for the app.
    # Offset by 5 min from the sync (:00) and laps (:10) jobs so the scheduled
    # workflows don't all hit Strava's token endpoint on the same minute.
    - cron: '40 3 * * *'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Run full stream backfill
        env:
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          BACKFILL_LIMIT:       ${{ github.event.inputs.limit || '60' }}
        run: python .github/scripts/backfill_full_streams.py
