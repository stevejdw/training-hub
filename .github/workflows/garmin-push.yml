name: Garmin push sync

# Fired by the app when Strava's webhook reports a new activity. Garmin has no
# webhook of its own, but it auto-syncs to Strava, so that notification means
# the ride is on Garmin too — this pulls it within a minute or two instead of
# waiting for the next scheduled poll. See lib/github-dispatch.ts.
on:
  repository_dispatch:
    types: [garmin-activity]
  # Quarter-hourly poll — the only path that reaches Garmin without Strava
  # in it at all, and therefore the one that has to be trusted.
  #
  # Garmin's unofficial API has no push: notifications live in the Connect
  # Developer Program, which is closed to individuals (see the header of
  # .github/scripts/garmin_common.py). Polling is consequently the only
  # genuinely direct trigger available, so its interval *is* the worst-case
  # freshness. Fifteen minutes is the compromise: fast enough that a ride is
  # in the hub before the kettle boils, slow enough (~96 logins a day on one
  # account) not to invite rate limiting on an API with no published quota
  # and no appeal process if it locks us out. If Garmin starts returning
  # 429s, widen this before touching anything else.
  #
  # The runs take ~60s, so the :00 slot clears the 6-hourly garmin-activities
  # job at :10 and its deeper 14-day window with minutes to spare — they
  # share this concurrency group and would otherwise cancel each other.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push-sync:
    runs-on: ubuntu-latest
    # Rides often produce a create and an update event seconds apart. Cancelling
    # the in-flight run keeps that to one sync rather than two.
    concurrency:
      group: garmin-activities
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests 'garminconnect==0.3.10' 'psycopg2-binary==2.9.12' 'cryptography==50.0.0'

      # A short window: this runs seconds after the ride, so only the newest
      # activities can possibly be missing.
      - name: Sync recent activities
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SECRETS_KEY: ${{ secrets.APP_SECRETS_KEY }}
        run: python .github/scripts/sync_garmin_activities.py 3

      # Streams, laps and route for whatever the step above just inserted.
      - name: Fill activity details
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SECRETS_KEY: ${{ secrets.APP_SECRETS_KEY }}
        run: python .github/scripts/sync_garmin_details.py 5

      # Adopt names the athlete set in Strava. Reads names only — Garmin stays
      # the source of truth for every measurement.
      - name: Adopt Strava names
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SECRETS_KEY: ${{ secrets.APP_SECRETS_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python .github/scripts/sync_strava_names.py 7
