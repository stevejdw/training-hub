name: Sync Garmin activity details

on:
  schedule:
    # Safety net only — garmin-push.yml fills details immediately after a new
    # ride. Offset from the other Garmin jobs to avoid contending for the token
    # bundle's advisory lock.
    - cron: '25 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max activities to fill this run'
        required: false
        default: '25'

jobs:
  details:
    runs-on: ubuntu-latest
    concurrency:
      group: garmin-details
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install 'garminconnect==0.3.10' 'psycopg2-binary==2.9.12' 'cryptography==50.0.0'

      # Fills streams, laps and the route polyline for Garmin-sourced rides —
      # everything the detail view, zone charts and map need, which
      # sync_garmin_activities deliberately leaves alone.
      - name: Sync details
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SECRETS_KEY: ${{ secrets.APP_SECRETS_KEY }}
        run: python .github/scripts/sync_garmin_details.py ${{ github.event.inputs.limit || '25' }}
