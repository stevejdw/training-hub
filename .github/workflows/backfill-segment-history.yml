name: Backfill Segment History

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes until remaining hits 0
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Scan activities for segment efforts
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/activities/backfill" \
            -H "Content-Type: application/json" \
            --max-time 90
