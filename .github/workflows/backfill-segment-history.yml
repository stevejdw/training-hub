name: Backfill Segment History

on:
  # The backfill is complete — the endpoint has returned {"processed":0,"remaining":0}
  # since 2026-08. The 15-minute schedule kept firing after there was nothing left
  # to do, burning ~46 billed Actions minutes a day to confirm zero (every job is
  # rounded up to a full minute, so a 5-second no-op still costs one).
  # Re-run by hand if a bulk re-import ever leaves efforts to scan again.
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Scan activities for segment efforts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "ERROR: APP_URL secret is not set"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET secret is not set"
            exit 1
          fi
          URL=$(echo "$APP_URL" | tr -d '[:space:]')
          echo "Posting to ${URL}/api/activities/backfill"

          http_code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "${URL}/api/activities/backfill" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120)

          echo "HTTP status: $http_code"
          echo "--- response body ---"
          cat /tmp/resp.txt
          echo ""
          echo "--- end body ---"

          if [ "$http_code" != "200" ]; then
            exit 1
          fi
