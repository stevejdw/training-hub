name: Backfill Segment History

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Repair null segment_ids + mark all activities synced
        run: |
          curl -f -s -X POST "${{ secrets.APP_URL }}/api/activities/backfill" \
            -H "Content-Type: application/json"
