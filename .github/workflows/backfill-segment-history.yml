name: Backfill Segment History

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Repair null segment_ids + mark all activities synced
        run: |
          BASE_URL="${APP_URL%/}"
          echo "Calling ${BASE_URL}/api/activities/backfill"
          curl -f -s -X POST "${BASE_URL}/api/activities/backfill" -H "Content-Type: application/json"
