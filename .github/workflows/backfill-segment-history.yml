name: Backfill Segment History

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes until remaining hits 0
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Scan activities for segment efforts
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "ERROR: APP_URL secret is not set"
            exit 1
          fi
          URL=$(echo "$APP_URL" | tr -d '[:space:]')
          echo "Posting to ${URL}/api/activities/backfill"

          http_code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "${URL}/api/activities/backfill" \
            -H "Content-Type: application/json" \
            --max-time 120)

          echo "HTTP status: $http_code"
          echo "--- response body ---"
          cat /tmp/resp.txt
          echo ""
          echo "--- end body ---"

          if [ "$http_code" != "200" ]; then
            exit 1
          fi
