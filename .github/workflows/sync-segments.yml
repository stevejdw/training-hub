name: Sync Starred Segments

on:
  schedule:
    - cron: '0 2 * * *'  # 2am UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh starred segments
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/segments/starred" \
            --fail --retry 3 --retry-delay 10 \
            -H "Content-Type: application/json"
