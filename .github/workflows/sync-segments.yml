name: Sync Starred Segments

on:
  schedule:
    - cron: '0 2 * * *'  # 2am UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh starred segments
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "ERROR: APP_URL secret is not set"
            exit 1
          fi
          URL=$(echo "$APP_URL" | tr -d '[:space:]')
          echo "Posting to ${URL}/api/segments/starred"

          # Capture body + status separately so we see WHY it failed
          http_code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "${URL}/api/segments/starred" \
            -H "Content-Type: application/json" \
            --max-time 120)

          echo "HTTP status: $http_code"
          echo "--- response body ---"
          cat /tmp/resp.txt
          echo ""
          echo "--- end body ---"

          if [ "$http_code" != "200" ]; then
            exit 1
          fi
