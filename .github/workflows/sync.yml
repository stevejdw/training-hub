name: Sync Strava to Neon

on:
  schedule:
    # Hourly at :00. Was every 30 minutes, which doubled the billed Actions
    # minutes (each job is rounded up to a whole minute, and this one runs for
    # ~12 seconds) to halve a freshness window that nothing depends on — rides
    # land once a day, and Garmin activities already sync hourly at :42.
    - cron: '35 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Run sync
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python .github/scripts/sync_strava.py
