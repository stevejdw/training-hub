name: Sync Strava to Neon

# No schedule, deliberately. Exactly one provider writes activities, and that
# is currently Garmin, so sync_strava.py's own gate (strava_ingest_enabled)
# returns early and this job writes nothing — it was booting a runner four
# times a day to print one line and exit. The comment it replaced justified
# the cadence on billed Actions minutes, which stopped being a consideration
# when the repo went public on 2026-08-22.
#
# The workflow stays because Strava is the documented fallback if Garmin's
# unofficial API breaks (see lib/sync-sources.ts). Switching back means:
# Settings -> Data sources -> Strava, then restore a cron here, because the
# webhook alone only covers rides from that moment on and nothing backfills
# the gap. Until then, run it by hand when you need a one-off catch-up.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Run sync
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python .github/scripts/sync_strava.py
